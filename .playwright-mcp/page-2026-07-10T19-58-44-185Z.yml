ntralized exchanges, miner extractable value, and consensus instability\",\"author\":\"P Daian\",\"year\":\"2020\",\"journal-title\":\"IEEE Symposium on Security and Privacy\"},{\"issue\":\"11\",\"key\":\"ref10\",\"doi-asserted-by\":\"crossref\",\"first-page\":\"1\",\"DOI\":\"10.1145\\/3570639\",\"article-title\":\"SoK: Decentralized exchanges (DEX) with automated market maker (AMM) protocols\",\"volume\":\"55\",\"author\":\"J Xu\",\"year\":\"2023\",\"journal-title\":\"ACM Computing Surveys\"},{\"issue\":\"3\",\"key\":\"ref11\",\"doi-asserted-by\":\"crossref\",\"first-page\":\"1189\",\"DOI\":\"10.1214\\/14-AAP1020\",\"article-title\":\"A probabilistic weak formulation of mean field games and applications\",\"volume\":\"25\",\"author\":\"R Carmona\",\"year\":\"2015\",\"journal-title\":\"The Annals of Applied Probability\"}],\"container-title\":[\"SSRN Electronic Journal\"],\"language\":\"en\",\"deposited\":{\"date-parts\":[[2026,4,25]],\"date-time\":\"2026-04-25T02:30:09Z\",\"timestamp\":1777084209000},\"score\":36.63111,\"resource\":{\"primary\":{\"URL\":\"https:\\/\\/www.ssrn.com\\/abstract=6644361\"}},\"issued\":{\"date-parts\":[[2026]]},\"references-count\":11,\"URL\":\"https:\\/\\/doi.org\\/10.2139\\/ssrn.6644361\",\"ISSN\":[\"1556-5068\"],\"issn-type\":[{\"value\":\"1556-5068\",\"type\":\"electronic\"}],\"published\":{\"date-parts\":[[2026]]}},{\"indexed\":{\"date-parts\":[[2025,12,15]],\"date-time\":\"2025-12-15T14:21:55Z\",\"timestamp\":1765808515847},\"reference-count\":8,\"publisher\":\"Elsevier BV\",\"content-domain\":{\"domain\":[],\"crossmark-restriction\":false},\"short-container-title\":[\"SSRN Journal\"],\"DOI\":\"10.2139\\/ssrn.4619679\",\"type\":\"journal-article\",\"created\":{\"date-parts\":[[2023,11,29]],\"date-time\":\"2023-11-29T17:21:46Z\",\"timestamp\":1701278506000},\"source\":\"Crossref\",\"is-referenced-by-count\":0,\"title\":[\"Returns Correspondence Between Bitcoin Futures &amp;amp; Bitcoin\"],\"prefix\":\"10.2139\",\"author\":[{\"given\":\"Sean\",\"family\":\"Grover\",\"sequence\":\"first\",\"affiliation\":[],\"role\":[{\"role\":\"author\",\"vocabulary\":\"crossref\"}]}],\"member\":\"78\",\"published-online\":{\"date-parts\":[[2023]]},\"reference\":[{\"issue\":\"1-2\",\"key\":\"ref1\",\"doi-asserted-by\":\"crossref\",\"first-page\":\"167\",\"DOI\":\"10.1016\\/0304-405X(76)90024-6\",\"article-title\":\"The Pricing of Commodity Contracts\",\"volume\":\"3\",\"author\":\"Fischer Black\",\"year\":\"1976\",\"journal-title\":\"Journal of Financial Economics\"},{\"key\":\"ref2\",\"article-title\":\"Bitcoin FOMO Fuels ETF Frenzy. Retail May Still Miss Out\",\"author\":\"Katherine Greifeld\",\"year\":\"2021\",\"journal-title\":\"Bloomberg\"},{\"key\":\"ref3\",\"article-title\":\"SEC Says Spot Bitcoin ETF Filings Are Inadequate\",\"author\":\"Vicky G Huang\",\"year\":\"2023\",\"journal-title\":\"The Wall Street Journal\"},{\"key\":\"ref4\",\"first-page\":\"104\",\"volume\":\"5\",\"author\":\"John C Hull\",\"year\":\"2014\",\"journal-title\":\"Options, Futures, and Other Derivatives. Chapter\"},{\"issue\":\"2\",\"key\":\"ref5\",\"doi-asserted-by\":\"crossref\",\"first-page\":\"197\",\"DOI\":\"10.1016\\/j.jfineco.2017.11.002\",\"volume\":\"127\",\"author\":\"Ralph S J Koijen\",\"year\":\"2018\",\"journal-title\":\"Journal of Financial Economics\"},{\"key\":\"ref6\",\"article-title\":\"$76 Billion a Day: How Binance Became the World's Biggest Crypto Exchange\",\"author\":\"Patricia Kowsmann\",\"year\":\"2021\",\"journal-title\":\"The Wall Street Journal\"},{\"key\":\"ref7\",\"article-title\":\"Bitcoin ETF Excitement Drives Wall Street Giant CME Above Binance in BTC Futures Rankings\",\"author\":\"Krisztian Sandor\",\"year\":\"2023\",\"journal-title\":\"CoinDesk\"},{\"issue\":\"1\",\"key\":\"ref8\",\"doi-asserted-by\":\"crossref\",\"first-page\":\"453\",\"DOI\":\"10.1111\\/jofi.12096\",\"article-title\":\"An Anotomy of Commodity Futures Risk Premia\",\"volume\":\"69\",\"author\":\"Marta Szymanowska\",\"year\":\"2014\",\"journal-title\":\"Journal of Finance\"}],\"container-title\":[\"SSRN Electronic Journal\"],\"language\":\"en\",\"deposited\":{\"date-parts\":[[2024,1,30]],\"date-time\":\"2024-01-30T00:19:30Z\",\"timestamp\":1706573970000},\"score\":35.82992,\"resource\":{\"primary\":{\"URL\":\"https:\\/\\/www.ssrn.com\\/abstract=4619679\"}},\"issued\":{\"date-parts\":[[2023]]},\"references-count\":8,\"URL\":\"https:\\/\\/doi.org\\/10.2139\\/ssrn.4619679\",\"ISSN\":[\"1556-5068\"],\"issn-type\":[{\"value\":\"1556-5068\",\"type\":\"electronic\"}],\"published\":{\"date-parts\":[[2023]]}},{\"indexed\":{\"date-parts\":[[2026,5,19]],\"date-time\":\"2026-05-19T14:13:44Z\",\"timestamp\":1779200024550,\"version\":\"3.51.4\"},\"posted\":{\"date-parts\":[[2026]]},\"group-title\":\"SSRN\",\"reference-count\":0,\"publisher\":\"Elsevier BV\",\"content-domain\":{\"domain\":[],\"crossmark-restriction\":false},\"abstract\":\"<jats:p>We analyse returns on cryptocurrency perpetual futures by first developing a cost-of-carry model tailored to digital assets. The model captures the link between spot and perpetual futures prices, implying a positive convenience yield and negligible off-chain storage costs. Furthermore, we employ a log-linear approximation to demonstrate that expected return of holding perpetual futures derive from the current log basis, misperception of forward-looking spot price, and expected futures-spot spreads over the \\u201cmaturity\\u201d of futures contract. We then assess a comprehensive set of 170 return predictors, classified into categories of basis, momentum, liquidity, size, and volatility. Sorting based on these predictors yields 63 statistically significant total returns (i.e. price movement plus funding fee yields, with each exceeding the 5 significance level). Finally, we demonstrate\\u00a0that a two-factor model, based on the log-basis and a price-volume relevant factor, effectively explains all 63 strategies, highlighting the role of systematic drivers in perpetual futures markets.<\\/jats:p>\",\"DOI\":\"10.2139\\/ssrn.6795783\",\"type\":\"posted-content\",\"created\":{\"date-parts\":[[2026,5,19]],\"date-time\":\"2026-05-19T13:41:26Z\",\"timestamp\":1779198086000},\"source\":\"Crossref\",\"is-referenced-by-count\":0,\"title\":[\"Anatomy of Cryptocurrency Perpetual Futures Returns\"],\"prefix\":\"10.2139\",\"author\":[{\"ORCID\":\"https:\\/\\/orcid.org\\/0000-0002-5087-8861\",\"authenticated-orcid\":true,\"given\":\"Yi\",\"family\":\"Cao\",\"sequence\":\"first\",\"affiliation\":[],\"role\":[{\"role\":\"author\",\"vocabulary\":\"crossref\"}]},{\"given\":\"Pengfei\",\"family\":\"Luo\",\"sequence\":\"additional\",\"affiliation\":[],\"role\":[{\"role\":\"author\",\"vocabulary\":\"crossref\"}]},{\"ORCID\":\"https:\\/\\/orcid.org\\/0000-0001-5241-1344\",\"authenticated-orcid\":true,\"given\":\"Yuhan\",\"family\":\"Cheng\",\"sequence\":\"additional\",\"affiliation\":[],\"role\":[{\"role\":\"author\",\"vocabulary\":\"crossref\"}]},{\"ORCID\":\"https:\\/\\/orcid.org\\/0000-0001-7272-2430\",\"authenticated-orcid\":true,\"given\":\"Yizhe\",\"family\":\"Dong\",\"sequence\":\"additional\",\"affiliation\":[],\"role\":[{\"role\":\"author\",\"vocabulary\":\"crossref\"}]}],\"member\":\"78\",\"deposited\":{\"date-parts\":[[2026,5,19]],\"date-time\":\"2026-05-19T13:41:26Z\",\"timestamp\":1779198086000},\"score\":34.1127,\"resource\":{\"primary\":{\"URL\":\"https:\\/\\/www.ssrn.com\\/abstract=6795783\"}},\"issued\":{\"date-parts\":[[2026]]},\"references-count\":0,\"URL\":\"https:\\/\\/doi.org\\/10.2139\\/ssrn.6795783\",\"published\":{\"date-parts\":[[2026]]},\"subtype\":\"preprint\"},{\"indexed\":{\"date-parts\":[[2026,3,8]],\"date-time\":\"2026-03-08T04:38:29Z\",\"timestamp\":1772944709632,\"version\":\"3.50.1\"},\"posted\":{\"date-parts\":[[2026]]},\"group-title\":\"SSRN\",\"reference-count\":0,\"publisher\":\"Elsevier BV\",\"content-domain\":{\"domain\":[],\"crossmark-restriction\":false},\"abstract\":\"<jats:p>We analyse returns on cryptocurrency perpetual futures by first developing a cost-of-carry model tailored to digital assets. The model captures the link between spot and perpetual futures prices, implying a positive convenience yield and negligible off-chain storage costs. Furthermore, we employ a log-linear approximation to demonstrate that expected return of holding perpetual futures derive from the current log basis, misperception of forward-looking spot price, and expected futures-spot spreads over the \\u201cmaturity\\u201d of futures contract. We then assess a comprehensive set of 170 return predictors, classified into categories of basis, momentum, liquidity, size, and volatility. Sorting based on these predictors yields 63 statistically significant total returns (i.e. price movement plus funding fee yields, with each exceeding the 5 significance level). Finally, we demonstrate\\u00a0that a two-factor model, based on the log-basis and a price-volume relevant factor, effectively explains all 63 strategies, highlighting the role of systematic drivers in perpetual futures markets.<\\/jats:p>\",\"DOI\":\"10.2139\\/ssrn.6365329\",\"type\":\"posted-content\",\"created\":{\"date-parts\":[[2026,3,7]],\"date-time\":\"2026-03-07T13:38:27Z\",\"timestamp\":1772890707000},\"source\":\"Crossref\",\"is-referenced-by-count\":0,\"title\":[\"Anatomy of Cryptocurrency Perpetual Futures Returns\"],\"prefix\":\"10.2139\",\"author\":[{\"ORCID\":\"https:\\/\\/orcid.org\\/0000-0002-5087-8861\",\"authenticated-orcid\":true,\"given\":\"Yi\",\"family\":\"Cao\",\"sequence\":\"first\",\"affiliation\":[],\"role\":[{\"role\":\"author\",\"vocabulary\":\"crossref\"}]},{\"given\":\"Pengfei\",\"family\":\"Luo\",\"sequence\":\"additional\",\"affiliation\":[],\"role\":[{\"role\":\"author\",\"vocabulary\":\"crossref\"}]},{\"ORCID\":\"https:\\/\\/orcid.org\\/0000-0001-5241-1344\",\"authenticated-orcid\":true,\"given\":\"Yuhan\",\"family\":\"Cheng\",\"sequence\":\"additional\",\"affiliation\":[],\"role\":[{\"role\":\"autho