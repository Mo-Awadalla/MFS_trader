- generic [active] [ref=e1]: "{\"status\":\"ok\",\"message-type\":\"work-list\",\"message-version\":\"1.0.0\",\"message\":{\"facets\":{},\"total-results\":878739,\"items\":[{\"indexed\":{\"date-parts\":[[2026,3,11]],\"date-time\":\"2026-03-11T08:05:14Z\",\"timestamp\":1773216314052,\"version\":\"3.50.1\"},\"posted\":{\"date-parts\":[[2026]]},\"group-title\":\"SSRN\",\"reference-count\":0,\"publisher\":\"Elsevier BV\",\"content-domain\":{\"domain\":[],\"crossmark-restriction\":false},\"abstract\":\"<jats:p>This paper studies funding rates in cryptocurrency perpetual futures as an algorithmic feedback rule rather than a passive transfer. In a continuous-time equilibrium with risk-constrained arbitrageurs and momentum speculators, a linear funding rule induces an endogenous mean-reverting basis. We derive a simple stability condition and characterize a welfare-optimal feedback strength. We then analyze how the funding update interval, funding rate caps, and clamp-style piecewise-linear rules used by major exchanges affect basis volatility and funding tails. A jump-and-crisis extension with liquidation-driven crashes generates large negative basis spikes and slow recoveries.<\\/jats:p>\",\"DOI\":\"10.2139\\/ssrn.6185958\",\"type\":\"posted-content\",\"created\":{\"date-parts\":[[2026,3,10]],\"date-time\":\"2026-03-10T10:14:37Z\",\"timestamp\":1773137677000},\"source\":\"Crossref\",\"is-referenced-by-count\":0,\"title\":[\"Funding Rate Mechanism in Perpetual Futures\"],\"prefix\":\"10.2139\",\"author\":[{\"given\":\"Tianyang\",\"family\":\"Zhang\",\"sequence\":\"first\",\"affiliation\":[],\"role\":[{\"role\":\"author\",\"vocabulary\":\"crossref\"}]}],\"member\":\"78\",\"deposited\":{\"date-parts\":[[2026,3,10]],\"date-time\":\"2026-03-10T10:14:37Z\",\"timestamp\":1773137677000},\"score\":43.565792,\"resource\":{\"primary\":{\"URL\":\"https:\\/\\/www.ssrn.com\\/abstract=6185958\"}},\"issued\":{\"date-parts\":[[2026]]},\"references-count\":0,\"URL\":\"https:\\/\\/doi.org\\/10.2139\\/ssrn.6185958\",\"published\":{\"date-parts\":[[2026]]},\"subtype\":\"preprint\"},{\"indexed\":{\"date-parts\":[[2026,5,12]],\"date-time\":\"2026-05-12T09:19:32Z\",\"timestamp\":1778577572987,\"version\":\"3.51.4\"},\"posted\":{\"date-parts\":[[2026]]},\"group-title\":\"SSRN\",\"reference-count\":0,\"publisher\":\"Elsevier BV\",\"content-domain\":{\"domain\":[],\"crossmark-restriction\":false},\"abstract\":\"<jats:p>Futures contracts derive their fair price from the cost of carry - the net expense of holding the underlying asset until delivery. In TradFi, this cost is embedded directly in the futures price through the basis, which converges to zero at expiry via arbitrage. Perpetual futures, having no expiry, replace this convergence mechanism with a periodic funding rate. The standard funding rate formula, established by BitMEX in 2016, includes two components: a premium index that ties the perp price to spot, and an interest rate (IR) component that captures the cost of carry as a baseline payment from one side to the other. This paper traces the IR component from its theoretical roots in cost-of-carry pricing, through its implementation history - from the original dynamic rate sourced from Bitfinex lending markets to its entrenchment as a fixed 0.01% per 8 hours (~10.95% APR) in April 2017, and its subsequent, largely unquestioned adoption as the industry standard across centralized and decentralized exchanges. We evaluate this fixed anchor in light of prevailing capital costs observed in DeFi lending platforms, highlighting the mismatches and persistent structural distortions that emerge when the IR departs from the real cost of financing. We detail cases where specific exchanges have intentionally modified the IR for certain markets, and articulate criteria for a more principled calibration. Finally, we critically examine the standard funding rate formula employed by most exchanges, showing how both its structure and its embedded anchors can generate systematic mispricings and unintended market consequences.<\\/jats:p>\",\"DOI\":\"10.2139\\/ssrn.6751742\",\"type\":\"posted-content\",\"created\":{\"date-parts\":[[2026,5,12]],\"date-time\":\"2026-05-12T09:04:47Z\",\"timestamp\":1778576687000},\"source\":\"Crossref\",\"is-referenced-by-count\":0,\"title\":[\"The misplaced anchor: interest rate components in perpetual futures funding mechanisms\"],\"prefix\":\"10.2139\",\"author\":[{\"ORCID\":\"https:\\/\\/orcid.org\\/0009-0007-1124-9644\",\"authenticated-orcid\":true,\"given\":\"Ramil\",\"family\":\"Amirov\",\"sequence\":\"first\",\"affiliation\":[],\"role\":[{\"role\":\"author\",\"vocabulary\":\"crossref\"}]}],\"member\":\"78\",\"deposited\":{\"date-parts\":[[2026,5,12]],\"date-time\":\"2026-05-12T09:04:47Z\",\"timestamp\":1778576687000},\"score\":40.227535,\"resource\":{\"primary\":{\"URL\":\"https:\\/\\/www.ssrn.com\\/abstract=6751742\"}},\"issued\":{\"date-parts\":[[2026]]},\"references-count\":0,\"URL\":\"https:\\/\\/doi.org\\/10.2139\\/ssrn.6751742\",\"published\":{\"date-parts\":[[2026]]},\"subtype\":\"preprint\"},{\"indexed\":{\"date-parts\":[[2023,4,6]],\"date-time\":\"2023-04-06T04:35:30Z\",\"timestamp\":1680755730022},\"reference-count\":3,\"publisher\":\"Elsevier BV\",\"content-domain\":{\"domain\":[],\"crossmark-restriction\":false},\"short-container-title\":[\"SSRN Journal\"],\"DOI\":\"10.2139\\/ssrn.4097789\",\"type\":\"journal-article\",\"created\":{\"date-parts\":[[2022,5,27]],\"date-time\":\"2022-05-27T23:45:24Z\",\"timestamp\":1653695124000},\"source\":\"Crossref\",\"is-referenced-by-count\":0,\"title\":[\"Futures As Prelude: Bitcoin Price Forecasting From Perpetual Futures Data\"],\"prefix\":\"10.2139\",\"author\":[{\"given\":\"B\",\"family\":\"Kachnowski\",\"sequence\":\"first\",\"affiliation\":[],\"role\":[{\"role\":\"author\",\"vocabulary\":\"crossref\"}]}],\"member\":\"78\",\"reference\":[{\"key\":\"ref1\",\"article-title\":\"Measuring Asset Values for Cash Settlement in Derivatives Markets: Hedonic Repeated Measures Indicies and Perpetual Futures\",\"author\":\"R Shiller\",\"journal-title\":\"Binance Frequently Asked Questions\"},{\"key\":\"ref2\",\"journal-title\":\"Binance Historical Market Data\"},{\"key\":\"ref3\",\"article-title\":\"[Note 1] deleted [Note 2] Indeed, the risk profiles of the underlying assets (the cryptocurrencies) themselves are often ill-understood, and the legal category of different types of cryptocurrencies (consider stable coins which try to track fiat currencies versus BTC which floats with respect to fiat, etc) is subject to ongoing scrutiny by legislative bodies the world over\",\"author\":\"A Cotrell\",\"year\":\"2022\",\"journal-title\":\"Returns Distribution Moments as One Day Ahead Forecasters of Crypto Currency Returns\"}],\"container-title\":[\"SSRN Electronic Journal\"],\"language\":\"en\",\"deposited\":{\"date-parts\":[[2023,4,5]],\"date-time\":\"2023-04-05T12:57:01Z\",\"timestamp\":1680699421000},\"score\":36.86639,\"resource\":{\"primary\":{\"URL\":\"https:\\/\\/www.ssrn.com\\/abstract=4097789\"}},\"issued\":{\"date-parts\":[[2022]]},\"references-count\":3,\"URL\":\"https:\\/\\/doi.org\\/10.2139\\/ssrn.4097789\",\"ISSN\":[\"1556-5068\"],\"issn-type\":[{\"value\":\"1556-5068\",\"type\":\"electronic\"}],\"published-other\":{\"date-parts\":[[2022]]},\"published\":{\"date-parts\":[[2022]]}},{\"indexed\":{\"date-parts\":[[2026,4,25]],\"date-time\":\"2026-04-25T02:48:05Z\",\"timestamp\":1777085285496,\"version\":\"3.51.4\"},\"reference-count\":11,\"publisher\":\"Elsevier BV\",\"content-domain\":{\"domain\":[],\"crossmark-restriction\":false},\"short-container-title\":[\"SSRN Journal\"],\"abstract\":\"<jats:p>Funding rate mechanisms are the primary microstructure tool used to balance long and short open interest in perpetual futures markets. Despite their central role, most centralized and decentralized venues rely on linear or near-linear funding rules, and systematic analysis of non-linear alternatives remains limited. I introduce and analyze a class of hyperbolic funding rate mechanisms that are capacity-aware by construction: they impose weak incentives near equilibrium while imposing sharply increasing marginal costs as open interest imbalance approaches protocol capacity constraints. I provide an axiomatic derivation showing the hyperbolic form is the unique mechanism satisfying four natural desiderata: linearity near equilibrium, capacity awareness, monotonicity, and convexity with a simple pole. I embed the mechanism in a mean-field game model and establish existence and uniqueness of equilibrium under standard conditions. Lyapunov stability analysis provides sufficient conditions for asymptotic rebalancing and characterizes the oscillation boundary. Agent-based simulations with 100 heterogeneous traders across four behavioral classes show that hyperbolic funding reduces open interest rebalancing half-life by 10-70% relative to linear funding under severe shocks, defined as initial imbalance greater than 50% of protocol capacity, while maintaining identical behavior near equilibrium. Monte Carlo analysis over 100 randomized shock scenarios confirms robustness. I characterize welfare redistribution across trader classes and identify the oscillation failure mode with explicit parameter bounds. I provide a parameter selection framework for protocol designers.<\\/jats:p>\",\"DOI\":\"10.2139\\/ssrn.6644361\",\"type\":\"journal-article\",\"created\":{\"date-parts\":[[2026,4,25]],\"date-time\":\"2026-04-25T02:26:16Z\",\"timestamp\":1777083976000},\"source\":\"Crossref\",\"is-referenced-by-count\":0,\"title\":[\"Hyperbolic Funding Rate Mechanisms for Open Interest Balancing in Perpetual Futures Markets\"],\"prefix\":\"10.2139\",\"author\":[{\"ORCID\":\"https:\\/\\/orcid.org\\/0009-0006-7733-4991\",\"authenticated-orcid\":true,\"given\":\"Nihar\",\"family\":\"Shah\",\"sequence\":\"first\",\"affiliation\":[],\"role\":[{\"role\":\"author\",\"vocabulary\":\"crossref\"}]}],\"member\":