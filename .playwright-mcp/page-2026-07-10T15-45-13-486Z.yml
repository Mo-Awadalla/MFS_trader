            - generic [ref=e140]:
              - heading "Abstract" [level=2] [ref=e141]
              - region "Main abstract" [ref=e142]:
                - paragraph [ref=e143]:
                  - text: We study the price impact of order book events—limit orders, market orders, and cancellations—using the NYSE Trades and Quotes data for fifty U.S. stocks. We show that, over short time intervals, price changes are mainly driven by the
                  - emphasis [ref=e144]: order flow imbalance
                  - text: (OFI), defined as the imbalance between supply and demand at the best bid and ask prices. Our study reveals a linear relation between OFI and price changes, with a slope inversely proportional to the market depth. These results are shown to be robust to intraday seasonality effects, and stable across time scales and across stocks. This linear price impact model, together with a scaling argument, implies the empirically observed “square-root” relation between the magnitude of price moves and trading volume, but this relation is found to be noisy and less robust than the one based on OFI. We discuss a potential application of OFI as a measure of adverse selection in limit order executions and discuss the implications for intraday volatility dynamics.
