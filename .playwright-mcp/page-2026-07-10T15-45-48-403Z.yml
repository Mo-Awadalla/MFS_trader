                  - cell [ref=e581]:
                    - link "Blue Ocean ATS" [ref=e582] [cursor=pointer]:
                      - /url: https://blueocean-tech.io/
                    - text: is the first alternative trading system to expand market hours, filling the gap to trade equities continuously throughout US evening hours.
                - row [ref=e583]:
                  - cell [ref=e584]:
                    - strong [ref=e585]: overnight
                  - cell "Our \"overnight\" feed is Alpaca's derived feed from the original BOATS source. It offers a cheaper, but slightly less accurate alternative for overnight US market data. The trades are 15 minutes delayed and adjusted to fit the bid-ask spread." [ref=e586]
