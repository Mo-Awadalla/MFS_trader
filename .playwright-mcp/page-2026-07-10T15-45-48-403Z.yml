                    - paragraph [ref=e568]: ℹ️ This is the only feed that can be used without a subscription.
                - row [ref=e569]:
                  - cell [ref=e570]:
                    - strong [ref=e571]: sip
                  - cell [ref=e572]:
                    - paragraph [ref=e573]:
                      - text: "This feed covers all US exchanges, originating directly from exchanges and is consolidated by the Securities Information Processors:"
                      - link "UTP" [ref=e574] [cursor=pointer]:
                        - /url: https://utpplan.com/
                      - text: (Nasdaq) and
                      - link "CTA" [ref=e575] [cursor=pointer]:
                        - /url: https://www.nyse.com/data/cta
                      - text: (NYSE). These SIPs play a crucial role in connecting various U.S. markets, processing and consolidating all bid/ask quotes and trades from multiple trading venues into a single, easily accessible data feed.
                    - paragraph [ref=e576]: Our data delivery ensures ultra-low latency and high reliability, as the information is transmitted directly to Alpaca's bare metal servers located in New Jersey, situated alongside many market participants.
                    - paragraph [ref=e577]: SIP data is particularly advantageous for developing your trading app, where precise and up-to-date price information is essential for traders and internal operations. It accounts for 100% of the market volume, providing comprehensive coverage for your trading needs.
                - row [ref=e578]:
                  - cell [ref=e579]:
