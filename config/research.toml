# Research environment — backtesting, sweeps, validation.
# No live broker. No real money. Used for strategy development.

mode = "research"
strategy_name = "dual_ma_crossover"
strategy_version = "0.1.0"
strategies_enabled = ["ma"]
artifacts_dir = "~/trading_artifacts"

[[brokers]]
name = "alpaca"
asset_class = "equity"
api_key_env = "ALPACA_API_KEY"
api_secret_env = "ALPACA_API_SECRET"
base_url = "https://paper-api.alpaca.markets"
data_url = "https://data.alpaca.markets"
is_paper = true

[[brokers]]
name = "ccxt_binance"
asset_class = "crypto"
api_key_env = "BINANCE_API_KEY"
api_secret_env = "BINANCE_API_SECRET"
base_url = "https://api.binance.com"
is_paper = true

[[data]]
symbols = ["AAPL", "MSFT", "GOOGL", "AMZN", "NVDA", "META"]
asset_class = "equity"
bar_frequency_raw = "1min"
target_frequencies = ["1h", "1d"]
start_date = "2020-01-01"
adjustment = "split_dividend"
storage_dir = "data/parquet/equity"
min_volume = 1000000.0
price_floor = 5.0

[[data]]
symbols = ["BTC/USDT", "ETH/USDT", "LTC/USDT", "SOL/USDT"]
asset_class = "crypto"
bar_frequency_raw = "1min"
target_frequencies = ["1h", "1d"]
start_date = "2020-01-01"
exchange = "binance"
storage_dir = "data/parquet/crypto"
min_volume = 1000000.0

[risk_limits]
per_position_pct = 0.01
max_daily_loss_pct = 0.03
block_new_at_daily_loss_pct = 0.02
max_weekly_loss_pct = 0.06
max_monthly_loss_pct = 0.15
max_gross_exposure_pct = 1.5
max_net_exposure_pct = 0.10
max_sector_gross_pct = 0.35
max_sector_net_pct = 0.10
max_correlated_cluster_gross_pct = 0.35
max_correlated_cluster_risk_pct = 0.03
correlation_threshold = 0.70
max_open_positions = 15

[portfolio]
sizing_method = "fixed_fraction"
per_position_risk_pct = 0.01
dollar_neutral = false
equal_weight = true
rebalance_frequency = "daily"

[cost_model]
slippage_fixed_pct = 0.0005
slippage_variable_coeff = 0.5
commission_pct = 0.0
sec_fee_per_dollar_sold = 5.1e-6
finra_taf_per_share_sold = 0.000119
crypto_taker_fee_pct = 0.001
crypto_maker_fee_pct = 0.0007
borrow_cost_annual_pct = 0.01

[monitoring]
dashboard_enabled = false
telegram_alerts = false

[engine]
bar_close_execution = true
reconciliation_interval_minutes = 60
startup_reconciliation_required = false
kill_switch_persistent = true

[live_deployment]
authorized = false
dry_run_mode = false
promotion_status = "research"
