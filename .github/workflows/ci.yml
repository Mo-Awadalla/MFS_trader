name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install locked dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Ruff
        run: python -m ruff check .

      - name: Unit and contract tests
        env:
          RUN_LIVE_BROKER_TESTS: '0'
          MFS_TEST_LOAD_DOTENV: '0'
        run: python -m pytest tests/unit tests/contracts tests/integration/test_ma_shakedown.py
