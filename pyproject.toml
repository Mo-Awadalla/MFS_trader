[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mfs-trader"
version = "0.1.0"
description = "Medium-frequency trading system with honest validation gauntlet"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Mohamed Awadalla" }]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "structlog>=24.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pytz>=2024.1",
    "scipy>=1.12",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.20"]
crypto = ["ccxt>=4.2"]
research = ["vectorbt>=0.26", "statsmodels>=0.14"]
monitoring = ["streamlit>=1.32"]
alerts = ["python-telegram-bot>=21.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pytz",
    "responses>=0.25",
]

[project.scripts]
mfs-engine = "engine.cli:main"
mfs-data = "data.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "storage*", "data*", "strategies*", "research*", "validation*", "portfolio*", "risk*", "execution*", "engine*", "monitoring*", "experiments*", "research_scout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "replay: marks replay/golden tests",
    "property: marks property-based tests",
    "live_broker: marks tests that hit real broker APIs (requires env keys, never run in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501", "SIM102"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
